r is critical for good health."}, {"word": "crochet", "sentence": "My aunt used a small hook to crochet a blanket."}, {"word": "cross-country", "sentence": "The cross-country runners trained on wooded trails."}, {"word": "cuckoo", "sentence": "We heard a cuckoo calling from the forest."}, {"word": "cultivate", "sentence": "Gardeners cultivate the soil before planting seeds."}, {"word": "cupboard", "sentence": "The clean plates belong in the kitchen cupboard."}, {"word": "currency", "sentence": "The euro is the currency used by many European countries."}, {"word": "cursive", "sentence": "She signed her name in neat cursive."}, {"word": "customary", "sentence": "It is customary to thank the host before leaving."}, {"word": "cylinder", "sentence": "The soup can is shaped like a cylinder."}, {"word": "dad joke", "sentence": "The corny dad joke made the whole family groan."}, {"word": "daughter", "sentence": "Their daughter plays the violin in the school orchestra."}, {"word": "debris", "sentence": "Workers cleared debris from the road after the storm."}, {"word": "December", "sentence": "Our winter vacation begins in December."}, {"word": "declaration", "sentence": "The mayor issued a declaration recognizing the volunteers."}, {"word": "defensive", "sentence": "The soccer team practiced a new defensive strategy."}, {"word": "delicacy", "sentence": "The chef prepared the regional delicacy with care."}, {"word": "deliveries", "sentence": "Morning deliveries arrived at the store before it opened."}, {"word": "deluxe", "sentence": "They reserved a deluxe room with a view of the lake."}, {"word": "Des Moines", "sentence": "Des Moines is the capital of Iowa."}, {"word": "desert", "sentence": "The camel crossed the hot desert slowly."}, {"word": "determination", "sentence": "Her determination helped her finish the difficult climb."}];const $=x=>document.getElementById(x);let q=[],cur,total=0,seen=0,score=0,missed=[],retryMissed=[],retry=false,pass=1;function show(x){['setup','practice','result','done'].forEach(v=>$(v).classList.toggle('hidden',v!==x))}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function loadVoices(){let vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en-US'));$('voice').innerHTML=vs.map(v=>`<option value="${v.name}">${v.name}</option>`).join('')||'<option value="">Default U.S. English voice</option>';let p=vs.find(v=>/Aria|Jenny|Zira|Samantha/i.test(v.name));if(p)$('voice').value=p.name}loadVoices();speechSynthesis.onvoiceschanged=loadVoices;function speak(t,next){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),v=speechSynthesis.getVoices().find(x=>x.name===$('voice').value);u.lang='en-US';u.rate=.82;if(v)u.voice=v;if(next)u.onend=next;speechSynthesis.speak(u)}function both(){speak(cur.word,()=>setTimeout(()=>speak(cur.sentence),180))}function next(){if(!q.length)return finish();cur=q.shift();seen++;$('answer').value='';$('feedback').textContent='';$('feedback').className='feedback';$('submit').disabled=false;$('counter').textContent=retry?`${seen} of ${seen+q.length}`:`${seen} of ${total}`;$('bar').style.width=`${100*seen/(seen+q.length)}%`;$('answer').focus();setTimeout(both,150)}function finish(){if(!retry){$('score').textContent=`${score}/${total}`;$('summary').textContent=missed.length?`${missed.length} incorrect word${missed.length===1?'':'s'} will repeat until mastered.`:'Perfect score!';$('retry').classList.toggle('hidden',!missed.length);show(missed.length?'result':'done')}else if(retryMissed.length){q=shuffle(retryMissed);retryMissed=[];seen=0;pass++;$('mode').textContent=`Missed-word practice · pass ${pass}`;next()}else show('done')}function begin(){let a=+$('start').value,b=+$('end').value,e=$('rangeError');e.textContent='';if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b>200||a>b){e.textContent='Enter a valid range from 1 to 200. The starting number cannot exceed the ending number.';return}q=sh
